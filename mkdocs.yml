site_name: Anvil — Developer Docs
site_description: Internals and file-format reference for the Anvil FPGA CLI
site_author: LogiSmith
site_url: https://logismith.github.io/Anvil/
copyright: "© 2026 LogiSmith — MIT License"

repo_url: https://github.com/LogiSmith/Anvil
repo_name: LogiSmith/Anvil

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

plugins:
  - search

nav:
  - Home: index.md
  - Architecture: architecture.md
  - File formats: file-formats.md
  - Module system: modules.md
  - Contributing: contributing.md
